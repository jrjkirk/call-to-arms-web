<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid themed background fills the full canvas so Android's maskable
       crop never clips into transparency; the mark sits inside the ~80%
       maskable safe zone. -->
  <rect width="512" height="512" fill="#0a0c11"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#12151d"/>
  <text x="256" y="256" font-size="260" text-anchor="middle" dominant-baseline="central">⚔️</text>
</svg>
