<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0b0e" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png?v=2" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-48.png?v=2" type="image/png" sizes="48x48" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest?v=2" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" sizes="180x180" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Call to Arms" />
		<!-- The page's own ground, so that even with no stylesheet it is dark,
		     not a white page with a giant logo on it. -->
		<style>html, body { background: #0a0b0e; color: #e9e0cd; }</style>
		<!-- Recovery for a page saved from an older deploy (a restored tab, a
		     home-screen app brought back from memory). Its stylesheet and code
		     files no longer exist, so nothing loads and nothing works, and the
		     reload in hooks.client.ts can't help because it lives in the code
		     that failed to load. This runs before any of it: if a file under
		     /_app/ fails, reload once to get the current page. Same flag as
		     hooks.client.ts, which the layout clears once the app mounts, so a
		     file that is genuinely missing reloads at most once. -->
		<script>
			(function () {
				var FLAG = 'cta_reloaded_for_stale_chunk';
				window.addEventListener('error', function (e) {
					var t = e.target;
					if (!t || (t.tagName !== 'LINK' && t.tagName !== 'SCRIPT')) return;
					if ((t.href || t.src || '').indexOf('/_app/') === -1) return;
					try {
						if (sessionStorage.getItem(FLAG)) return;
						sessionStorage.setItem(FLAG, '1');
					} catch (_) {
						return;
					}
					location.reload();
				}, true);

				// A stylesheet that "loaded" but never applied: a damaged copy held
				// in the browser's cache. App files are cached as never-changing,
				// so even pull-to-refresh reuses it, and the page stays unstyled
				// for good (2026-10-23, on Joel's phone). If the app's font isn't
				// on the body once the page has loaded, fetch each app stylesheet
				// again under a one-off address, which skips any cached copy.
				window.addEventListener('load', function () {
					if (getComputedStyle(document.body).fontFamily.indexOf('Barlow') !== -1) return;
					var links = document.querySelectorAll('link[rel="stylesheet"][href*="/_app/"]');
					for (var i = 0; i < links.length; i++) {
						var fresh = links[i].cloneNode();
						fresh.href = links[i].href.split('?')[0] + '?fresh=' + Date.now();
						links[i].parentNode.insertBefore(fresh, links[i].nextSibling);
					}
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
